<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>商品详情</title>
  <link rel="stylesheet" href="/store.css" />
</head>
<body data-page="product">
  <header class="nav">
    <a class="back" href="/">‹ 返回</a>
    <a class="brand" href="/" data-shop-name>AI 试衣间</a>
    <button class="nav-btn" data-open-order>微信下单</button>
  </header>

  <main class="wrap detail" id="detail" hidden>
    <div class="detail-img"><img id="pImg" alt="" /></div>
    <div class="detail-info">
      <h1 id="pName"></h1>
      <div class="price big" id="pPrice"></div>
      <p class="desc" id="pDesc"></p>

      <div class="label">尺码</div>
      <div class="sizes" id="pSizes"></div>

      <a class="btn primary block" id="tryBtn">📷 实时试穿这件</a>
      <button class="btn ghost block" data-open-order>微信下单</button>
      <p class="hint">本站不在线收款。点“微信下单”添加店主微信，发送商品和尺码即可下单。</p>
    </div>
  </main>
  <p class="empty" id="notFound" hidden>商品不存在，<a href="/">返回首页</a></p>

  <div id="orderModal" class="modal" hidden></div>
  <script src="/store.js"></script>
</body>
</html>
